<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#005826" />
      <stop offset="100%" stop-color="#003818" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE043" />
      <stop offset="100%" stop-color="#FB7BA2" />
    </linearGradient>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2136E" />
      <stop offset="100%" stop-color="#A8094E" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Base Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Subtle Outer Border Accent -->
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="url(#goldGrad)" stroke-width="8" opacity="0.4" />

  <!-- Shield / Emblem Geometry -->
  <g filter="url(#glow)" transform="translate(256, 256)">
    <!-- Central Bank Shield Icon Frame -->
    <path d="M 0 -170 L 130 -110 C 130 50 80 140 0 180 C -80 140 -130 50 -130 -110 Z" fill="#004D21" stroke="url(#goldGrad)" stroke-width="12"/>

    <!-- Lettering / Symbol Fusion: JB Shield + bKash 'b' Geometric Node -->
    <!-- Janata Bank 'J' Arc (Left) -->
    <path d="M -50 -70 L -20 -70 L -20 30 C -20 60 -40 75 -70 75 C -85 75 -95 70 -100 65 L -90 35 C -85 40 -75 45 -65 45 C -50 45 -45 35 -45 20 Z" fill="#FFFFFF" />

    <!-- bKash Origami Fast Diamond / Arrow (Right Accent) -->
    <path d="M 10 -40 L 70 -80 L 90 -20 L 30 20 Z" fill="url(#pinkGrad)" />
    <path d="M 30 20 L 90 -20 L 70 60 L 10 20 Z" fill="#E2136E" opacity="0.85" />
    <path d="M 10 20 L 70 60 L 20 90 Z" fill="#F03387" opacity="0.9" />

    <!-- Premium Golden Star Anchor Top Center -->
    <path d="M 0 -130 L 7 -110 L 28 -110 L 11 -97 L 17 -77 L 0 -90 L -17 -77 L -11 -97 L -28 -110 L -7 -110 Z" fill="#FCE043" />
  </g>
</svg>
